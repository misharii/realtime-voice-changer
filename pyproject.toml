[project]
name = "voice-changer"
version = "0.1.0"
description = "Low-latency mic → Target Voice → VB-Cable virtual mic"
requires-python = ">=3.12,<3.13"
dependencies = [
    "httpx>=0.27",
    "numpy>=1.26",
    "onnxruntime>=1.18",
    "pynput>=1.7",
    "python-dotenv>=1.0",
    "sounddevice>=0.5",
]

[project.scripts]
voice-changer = "voice_changer.app:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/voice_changer"]

[tool.pytest.ini_options]
pythonpath = ["src"]
